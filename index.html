<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- webOS renders web apps at 1920x1080 (or 1280x720 on older sets); the
       CSS scales everything from the viewport width, so no zoom is needed. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Prosper LG TV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Everything is rendered by app.js; see src/main.js. -->
  <div id="app"></div>
  <script src="app.js"></script>
</body>
</html>
